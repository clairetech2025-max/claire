name: Deploy CLAIRE Cloudflare Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hf_claire_runtime_full/**"
      - "claire/**"
      - "claire_are/**"
      - "claire_continuity/**"
      - "claire_core/**"
      - "configs/**"
      - "veritas_legal/**"
      - "*.py"
      - "main.go"
      - "pyproject.toml"
      - "deploy/huggingface/claire.manifest.json"
      - "deploy/cloudflare/**"
      - ".github/workflows/deploy-cloudflare-staging.yml"

permissions:
  contents: read

concurrency:
  group: deploy-claire-cloudflare-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CLAIRE
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The edge twin is built from the live Space commit, not from this repo's
      # copies, so both twins always run identical source.
      - name: Check out the primary (Hugging Face) twin
        run: |
          git lfs install
          git clone --depth 1 https://huggingface.co/spaces/Blackstormhorse/CLAIRE_Control_Interface /tmp/claire-hf-space

      - name: Build Cloudflare deployment tree
        run: bash scripts/deploy/build_cloudflare_tree.sh /tmp/claire-hf-space /tmp/claire-cloudflare-build

      - name: Install Cloudflare deployment dependencies
        working-directory: /tmp/claire-cloudflare-build
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Deploy staging Worker and container
        working-directory: /tmp/claire-cloudflare-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN GitHub secret is required" >&2
            exit 2
          fi
          npx wrangler deploy --config wrangler.jsonc --containers-rollout=immediate

      - name: Smoke staging URLs
        run: |
          # First request after a rollout boots the container, restores durable
          # state and runs the ARE acceptance gate; allow a few minutes.
          for url in \
            "https://claire-staging.clairetech2025.workers.dev/health" \
            "https://clairesystems.ai/runtime/health"; do
            echo "Checking ${url}"
            ok=0
            for attempt in $(seq 1 30); do
              if body="$(curl --fail --show-error --silent --location --max-time 60 "$url")" \
                && ! echo "$body" | grep -q "Failed to start container"; then
                echo "$body"
                ok=1
                break
              fi
              echo "attempt ${attempt}: not ready yet"
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "Staging runtime did not become healthy at ${url}" >&2
              exit 1
            fi
          done

      - name: Verify twin parity with Hugging Face
        run: |
          hf="$(curl --fail --silent --retry 20 --retry-delay 15 --retry-all-errors --max-time 60 https://blackstormhorse-claire-control-interface.hf.space/health | jq -S .deployment)"
          edge="$(curl --fail --silent --max-time 60 https://clairesystems.ai/runtime/health | jq -S .deployment)"
          echo "HF:   $hf"
          echo "Edge: $edge"
          if [ "$hf" != "$edge" ]; then
            echo "Edge runtime deployment identity differs from the Hugging Face twin" >&2
            exit 1
          fi
